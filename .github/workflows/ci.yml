name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # HANDOFF.md §7: "Regression test that must run in CI." These cover the
      # invariants of §13, the benchmark fairness of §5, and a diff of the
      # ported generator against the original prototype.
      - name: Regression tests
        run: npm test
      - name: Build
        run: npm run build
